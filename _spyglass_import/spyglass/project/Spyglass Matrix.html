<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spyglass · Project Matrix</title>
  <link rel="icon" type="image/svg+xml" href="brand/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="brand/tokens.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    ::selection { background: var(--ink); color: #fff; }
    button { font-family: inherit; }
    @keyframes spgSpin { to { transform: rotate(360deg); } }
    @keyframes spgReveal { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    @keyframes spgFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes spgSlideIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      [style*="spgSlideIn"], [style*="spgFade"] { animation: none !important; }
    }
    /* === Type scale — bumped for readability === */
    .t-body      { font-size: 16.5px; line-height: 1.55; }
    .t-mono-btn  { font-size: 13px; }
    .t-mono-tag  { font-size: 12.5px; }
    .t-mono-xs   { font-size: 11.5px; letter-spacing: 0.06em; }
    .t-section-label { font-weight: 700; color: var(--ink-2); }
    .t-card-lg   { font-size: 27px; }
    .t-display-lg{ font-size: 42px; }
    /* === Re-skin: navy + black + white; rich gold as a jewel only — no faded yellow === */
    :root {
      --amber-bg:   #f5f5f4;   /* was faint gold wash → neutral paper */
      --amber-pale: #ececea;
      --gold-line:  #e7e5e4;   /* was pale-gold hairline → neutral line */
      --amber-dd:   #0A1F3D;   /* muddy deep-gold text/icons → navy */
      --amber-ddd:  #0A1F3D;
      --green-d:    #0A1F3D;   /* muddy "success" → navy */
      --green:      #0A1F3D;   /* status dots → navy */
    }
    /* scrollbar */
    ::-webkit-scrollbar { width: 11px; height: 11px; }
    ::-webkit-scrollbar-thumb { background: var(--ink-4); border-radius: 99px; border: 3px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="app/data.jsx"></script>
  <script type="text/babel" src="app/flow-data.jsx"></script>
  <script type="text/babel" src="app/ui.jsx"></script>
  <script type="text/babel" src="app/sourcing.jsx"></script>
  <script type="text/babel" src="app/dossier.jsx"></script>
  <script type="text/babel" src="app/client.jsx"></script>
  <script type="text/babel" src="app/pipeline.jsx"></script>
  <script type="text/babel" src="app/engagement.jsx"></script>
  <script type="text/babel" src="app/matrix.jsx"></script>
  <script type="text/babel" src="app/app.jsx"></script>
</body>
</html>
